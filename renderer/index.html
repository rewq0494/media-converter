<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">

    <!-- Title Bar -->
    <div class="title-bar">
      <span class="title-bar-text" data-i18n="appTitle">Media Converter</span>
      <button class="lang-toggle" id="langToggle">EN</button>
    </div>

    <nav class="mode-switch" aria-label="Mode">
      <button class="mode-card selected" id="modeConvert" data-mode="convert" aria-pressed="true">
        <span class="mode-icon" aria-hidden="true">⇄</span><span><strong data-i18n="modeConvert">轉換格式</strong><small data-i18n="modeConvertHint">換個格式，在哪都能播</small></span><span class="mode-check" aria-hidden="true">✓</span>
      </button>
      <button class="mode-card" id="modeCompress" data-mode="compress" aria-pressed="false">
        <span class="mode-icon" aria-hidden="true">↘</span><span><strong data-i18n="modeCompress">壓縮影片</strong><small data-i18n="modeCompressHint">縮小體積，分享更輕鬆</small></span><span class="mode-check" aria-hidden="true">✓</span>
      </button>
    </nav>
    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step-dot active" id="stepDot1">
        <span class="step-num">1</span>
        <span class="step-label" data-i18n="step1">選擇檔案</span>
      </div>
      <div class="step-line"></div>
      <div class="step-dot" id="stepDot2">
        <span class="step-num">2</span>
        <span class="step-label" data-i18n="step2">轉換設定</span>
      </div>
      <div class="step-line"></div>
      <div class="step-dot" id="stepDot3">
        <span class="step-num">3</span>
        <span class="step-label" data-i18n="step3">完成</span>
      </div>
    </div>

    <!-- Step 1: Select File -->
    <div class="step-panel active" id="step1Panel">
      <div class="intro"><span class="eyebrow" data-i18n="localBadge">LOCAL MEDIA STUDIO · 離線處理</span><h1 id="heroTitle"></h1><p id="heroHint"></p></div>
      <div class="drop-zone" id="dropZone" role="button" tabindex="0">
        <div class="drop-icon" aria-hidden="true"><span class="file-tile">▶</span><span class="file-orbit">✦</span></div>
        <p class="drop-primary" data-i18n="dropPrimary">拖拉檔案到這裡</p>
        <p class="drop-or" data-i18n="dropOr">或</p>
        <button class="btn-primary" id="dropBtn" data-i18n="dropBtn">選擇檔案</button>
        <p class="drop-hint" data-i18n="dropHint">支援 MP4、MOV、MKV、AVI、MP3、WAV、FLAC、AAC 等</p>
      </div>
      <div id="fileInfo" style="display:none"></div>
      <p class="inline-error" id="fileError" role="alert" hidden></p>
      <p class="privacy-note" data-i18n="privacyNote">⌁ 檔案不離開這台 Mac，原檔也會好好保留。</p>
      <input type="file" id="fileInput" accept="video/*,audio/*,.mkv,.flac,.ogg,.opus,.wma,.m4a,.webm" style="display:none">
    </div>

    <!-- Step 2: Settings -->
    <div class="step-panel" id="step2Panel">
      <div class="settings-heading"><div><span class="eyebrow" id="settingsEyebrow"></span><h1 id="settingsTitle"></h1></div><span class="task-badge" id="taskBadge"></span></div>
      <div class="source-strip"><span aria-hidden="true">▤</span><div><strong id="sourceName"></strong><small id="sourceMeta"></small></div><button class="btn-secondary btn-sm" id="replaceFile" data-i18n="fileInfoChange">更換檔案</button></div>
      <section id="conversionSettings">
        <p class="section-title" data-i18n="formatTitle">輸出格式</p>
        <div class="format-tabs" id="formatTabs"></div>
        <div class="format-grid" id="formatGrid"></div>
        <div id="advancedPanel"></div>
      </section>
      <section id="compressionSettings" hidden>
        <div class="profile-grid">
          <button class="profile-card selected" data-profile="balanced" aria-pressed="true"><span class="profile-tag" data-i18n="recommended">推薦</span><span class="profile-symbol" aria-hidden="true">↗</span><strong data-i18n="balancedTitle">日常分享</strong><span class="profile-spec">1080p · 30 fps</span><small data-i18n="balancedHint">清晰度與大小，剛剛好。</small></button>
          <button class="profile-card" data-profile="small" aria-pressed="false"><span class="profile-tag" data-i18n="smallerTag">體積優先</span><span class="profile-symbol" aria-hidden="true">↘</span><strong data-i18n="smallTitle">更小檔案</strong><span class="profile-spec">720p · 30 fps</span><small data-i18n="smallHint">適合快速傳送，細節會少一些。</small></button>
        </div>
        <div class="compression-summary"><span class="summary-icon" aria-hidden="true">✦</span><div><strong id="compressionSummary"></strong><p data-i18n="compressionNote">保留音訊、另存 MP4；小影片不放大。實際大小依內容而定，不保證每支影片都會縮小。</p></div></div>
      </section>
      <div class="output-dir-section">
        <p class="section-title" data-i18n="outputDirTitle">儲存到</p>
        <div class="output-dir-row">
          <span class="output-dir-display" id="outputDirDisplay">~/Downloads</span>
          <button class="btn-secondary btn-sm" id="changeDirBtn" data-i18n="outputDirChange">更改</button>
        </div>
      </div>
      <div class="step-actions">
        <button class="btn-secondary" id="backBtn" data-i18n="btnBack">← 返回</button>
        <button class="btn-primary" id="convertBtn">開始轉換</button>
      </div>
    </div>

    <!-- Step 3: Progress / Done / Error -->
    <div class="step-panel" id="step3Panel">
      <div class="center-section" id="progressSection">
        <div class="prog-icon spin" aria-hidden="true">✳</div>
        <h2 class="prog-title" id="progressTitle">轉換中…</h2>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-stats">
          <span id="progressPct">0%</span>
          <span id="progressTime"></span>
        </div>
        <button class="btn-secondary" id="cancelBtn" data-i18n="btnCancel">取消</button>
      </div>

      <div class="center-section" id="doneSection" style="display:none">
        <div class="result-icon success-icon">✓</div>
        <h2 class="result-title success-text" id="doneTitle">轉換完成！</h2>
        <p class="out-file-path" id="outFilePath"></p>
        <div class="size-result" id="sizeResult" aria-live="polite"></div><p class="preset-desc" id="resultHint"></p>
        <div class="done-actions">
          <button class="btn-secondary" id="openFolderBtn" data-i18n="btnOpenFolder">📁 開啟資料夾</button>
          <button class="btn-secondary" id="anotherBtn" data-i18n="btnConvertAnother">再轉一個</button>
          <button class="btn-secondary" id="quitBtn" data-i18n="btnQuit">關閉應用程式</button>
        </div>
      </div>

      <div class="center-section" id="errorSection" style="display:none">
        <div class="result-icon error-icon">✗</div>
        <h2 class="result-title error-text" data-i18n="errorTitle">轉換失敗</h2>
        <p class="error-msg" id="errorMsg"></p>
        <div class="done-actions">
          <button class="btn-secondary" id="retryBtn" data-i18n="btnRetry">← 重試</button>
          <button class="btn-secondary" id="quitErrBtn" data-i18n="btnQuit">關閉應用程式</button>
        </div>
      </div>
    </div>

  </div>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
